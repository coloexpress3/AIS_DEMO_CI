name: UFT Pipeline

# Pipeline mode: runs the default UFT test on the self-hosted Windows runner
# and publishes the result to CSDP as a pipeline run. CSDP creates the
# automated test from this result. (Test Suite mode lives in uft-test.yml.)

on:
  workflow_dispatch:
    inputs:
      testsToRun:
        description: 'Tests to run (from OpenText SDP)'
        required: false
        default: ''
      suiteRunId:
        description: 'Suite Run Id (from OpenText SDP)'
        required: true
        default: '0'
      executionId:
        description: 'Execution Id (from OpenText SDP)'
        required: true
        default: '0'
      suiteId:
        description: 'Suite Id (from OpenText SDP)'
        required: true
        default: '0'
        
env:
  TESTS_TO_RUN_MTBX: testsToRun.mtbx
  PROPS_TXT: FT-pipeline-props.txt
  RES_XML: FT-test-results.xml
  LAUNCHER_EXE: FTToolsLauncher.exe
  LAUNCHER_URL: https://github.com/MicroFocus/ADM-FT-ToolsLauncher/releases/download/v24.2.0/FTToolsLauncher_net48.exe
  UFT_TEST_PATH: 'C:\Users\Supareak.i\Documents\Functional Testing\DemoGUI'

jobs:
  run-tests:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Show runner information
        shell: powershell
        run: |
         Write-Host "Runner: $env:COMPUTERNAME"
         Write-Host "UFT Test: $env:UFT_TEST_PATH"
       
         if (Test-Path $env:UFT_TEST_PATH) {
           Write-Host "AOS UFT test found."
         } else {
           Write-Error "AOS UFT test NOT found at $env:UFT_TEST_PATH"
         exit 1
         }
         
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
         node-version: '22'
         
      - name: Convert testsToRun parameter
        if: ${{ github.event.inputs.testsToRun != '' }}
        id: convert_tests
        shell: powershell
        run: |
         $output = npx @opentext/sdp-sdm-tests-to-run-conversion --framework="uft" --testsToRun="${{github.event.inputs.testsToRun }}" --logLevel=0
         Write-Host "Original Node output: $output"
         $output = $output -replace '%20', ' '
         Write-Host "Decoded Node output: $output"
         $output | Out-File -FilePath $env:TESTS_TO_RUN_MTBX -Encoding utf8
         
      - name: Create UFT properties file
        shell: powershell
        run: |
          if (-not (Test-Path $env:UFT_TEST_PATH)) {
            Write-Error "UFT test NOT found at $env:UFT_TEST_PATH"
            exit 1
          }
          Remove-Item $env:RES_XML, $env:PROPS_TXT -ErrorAction SilentlyContinue
          $escapedTarget = $env:UFT_TEST_PATH.Replace('\', '\\')
          $lines = @(
            "runType=FileSystem",
            "resultsFilename=$env:RES_XML",
            "Test1=$escapedTarget",
            "resultTestNameOnly=true",
            "resultUnifiedTestClassname=true"
          )
          $lines | Out-File -FilePath $env:PROPS_TXT -Encoding utf8
          Get-Content $env:PROPS_TXT

      - name: Download Functional Testing launcher
        shell: powershell
        run: |
          if (-not (Test-Path $env:LAUNCHER_EXE)) {
            Invoke-WebRequest -Uri $env:LAUNCHER_URL -OutFile $env:LAUNCHER_EXE
          }

      - name: Run UFT test
        shell: powershell
        run: |
          $process = Start-Process -FilePath "$env:LAUNCHER_EXE" `
            -ArgumentList "-paramfile $env:PROPS_TXT" `
            -NoNewWindow -PassThru
          $process | Wait-Process
          Write-Host "FTToolsLauncher exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) {
            exit $process.ExitCode
          }

      - name: Archive UFT test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: uft-test-results
          path: FT-test-results.xml
        continue-on-error: true
