name: OpenText Software Delivery Platform Integration

on:
  workflow_run:
    workflows: ["CSDP Demo Pipeline", "UFT Pipeline"]
    types: [requested, in_progress, completed]

permissions:
  actions: read
  contents: read
  pull-requests: read
  deployments: write

jobs:
  sdp_integration_job:
    runs-on: ubuntu-latest
    
    steps:
      - name: Publish to OpenText SDP
        uses: opentext/sdp-github-actions-integration@v26.4.0
        with:
          octaneUrl: 'https://almoctane-apj.saas.microfocus.com'
          octaneSharedSpace: 299004
          octaneWorkspace: 5002
          octaneClientId: ${{secrets.SDP_CLIENT_ID}}
          octaneClientSecret: ${{secrets.SDP_CLIENT_SECRET}}
          githubToken: ${{secrets.GITHUB_TOKEN}}
          serverBaseUrl: 'https://github.com/coloexpress3/AIS_DEMO_CI'
          pipelineNamePattern: '${workflow_name}'
          unitTestResultsGlobPattern: "**/*.xml"
          testingFramework: uft
          logLevel: '2'
